name: Test Ubicloud Prod Runners

on:
  push:
    branches: [enes/test-wiz]
  # schedule:
  #   - cron: '0 * * * *'

jobs:
  test:
    # container:
    #   image: ubuntu:latest
      # options: --init
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubicloud-standard-2-ubuntu-2604
          - ubicloud-standard-2-ubuntu-2404
          - ubicloud-standard-2-ubuntu-2204
          - ubicloud-standard-2-arm-ubuntu-2604
          - ubicloud-standard-2-arm-ubuntu-2404
          - ubicloud-standard-2-arm-ubuntu-2204

    runs-on: ${{ matrix.runs-on }}
    name: ${{ matrix.runs-on }}
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - name: Setup Wiz Sensor
        run: |
          sudo WIZ_PACKAGE_SKIP_INSTALL=1 \
            WIZ_API_CLIENT_ID="${{ secrets.WIZ_API_CLIENT_ID }}aa" \
            WIZ_API_CLIENT_SECRET="${{ secrets.WIZ_API_CLIENT_SECRET }}aa" \
            bash "/opt/wiz-sensor-install.sh"
