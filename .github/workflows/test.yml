name: Test Ubicloud Prod Runners

on:
  push:
    branches: [main]
  # schedule:
  #   - cron: '0 * * * *'

jobs:
  test:
    # container:
    #   image: ubuntu:latest
      # options: --init
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubicloud-standard-2-ubuntu-2404
          - ubicloud-standard-2-arm-ubuntu-2404
          - ubuntu-24.04
          - ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}
    name: ${{ matrix.runs-on }}
    steps:
      - name: checkout
        uses: actions/checkout@v6

      - run: uptime -s
      - run: uname -a
      - run: sudo apt update
      - run: ls -lah /etc/apt/sources.list.d/
      - run: lsb_release -a
      - run: sudo systemctl status lvm2-monitor.service || true
      - run: sudo systemctl status multipathd.service multipathd.socket || true
      - run: sudo systemctl status ModemManager.service || true
      - run: sudo systemctl status phpsessionclean.service phpsessionclean.timer || true
      - run: sudo systemctl status || true
      - run: sudo systemctl || true
